<div class="container">
  <div class="header-container">
    <h1 class="mat-headline-5">Laptop Transfers</h1>
    <button mat-raised-button color="primary" (click)="openNewTransferDialog()">
      <mat-icon>swap_horiz</mat-icon> New Transfer
    </button>
  </div>

  <mat-card>
    <mat-card-content>
      <mat-form-field appearance="outline" class="filter-field">
        <mat-label>Filter</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Search transfers..." />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>

      <div class="mat-elevation-z2 table-container">
        <table mat-table [dataSource]="dataSource" matSort>
          <!-- Transfer ID Column -->
          <ng-container matColumnDef="transferId">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Transfer ID</th>
            <td mat-cell *matCellDef="let transfer">{{ transfer.id }}</td>
          </ng-container>

          <!-- From Branch Column -->
          <ng-container matColumnDef="fromBranch">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>From</th>
            <td mat-cell *matCellDef="let transfer">{{ transfer.fromBranchName }}</td>
          </ng-container>

          <!-- To Branch Column -->
          <ng-container matColumnDef="toBranch">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>To</th>
            <td mat-cell *matCellDef="let transfer">{{ transfer.toBranchName }}</td>
          </ng-container>

          <!-- Items Column -->
          <ng-container matColumnDef="items">
            <th mat-header-cell *matHeaderCellDef>Items</th>
            <td mat-cell *matCellDef="let transfer">{{ transfer.items.length }}</td>
          </ng-container>

          <!-- Request Date Column -->
          <ng-container matColumnDef="requestDate">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Request Date</th>
            <td mat-cell *matCellDef="let transfer">{{ transfer.requestDate | date }}</td>
          </ng-container>

          <!-- Status Column -->
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
            <td mat-cell *matCellDef="let transfer">
              <mat-chip [color]="getStatusColor(transfer.status)" selected>
                {{ transfer.status }}
              </mat-chip>
            </td>
          </ng-container>

          <!-- Actions
                       <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let transfer">
              <button
                mat-icon-button
                color="primary"
                (click)="viewTransferDetail(transfer)"
                matTooltip="View Details"
              >
                <mat-icon>visibility</mat-icon>
              </button>
              <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Actions">
                <mat-icon>more_vert</mat-icon>
              </button>
              <mat-menu #menu="matMenu">
                <button
                  mat-menu-item
                  *ngIf="transfer.status === 'Pending'"
                  (click)="updateStatus(transfer, 'Approved')"
                >
                  <mat-icon>check_circle</mat-icon>
                  <span>Approve</span>
                </button>
                <button
                  mat-menu-item
                  *ngIf="transfer.status === 'Approved'"
                  (click)="updateStatus(transfer, 'In Transit')"
                >
                  <mat-icon>local_shipping</mat-icon>
                  <span>Mark In Transit</span>
                </button>
                <button
                  mat-menu-item
                  *ngIf="transfer.status === 'In Transit'"
                  (click)="updateStatus(transfer, 'Completed')"
                >
                  <mat-icon>done_all</mat-icon>
                  <span>Complete Transfer</span>
                </button>
                <button
                  mat-menu-item
                  *ngIf="transfer.status === 'Pending'"
                  (click)="updateStatus(transfer, 'Rejected')"
                >
                  <mat-icon>cancel</mat-icon>
                  <span>Reject</span>
                </button>
              </mat-menu>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

          <!-- Row shown when there is no matching data. -->
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="7">No data matching the filter</td>
          </tr>
        </table>

        <mat-paginator
          [pageSizeOptions]="[5, 10, 25, 100]"
          aria-label="Select page of transfers"
        ></mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
