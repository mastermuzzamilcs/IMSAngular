<div class="container">
  <mx-page-header title="Laptop Transfers" subtitle="Transfer stock between branches">
    <mx-button
      variant="outline"
      tone="primary"
      icon="swap_horiz"
      (pressed)="openNewTransferDialog()"
      >New Transfer</mx-button
    >
  </mx-page-header>

  <mx-grid
    [loading]="tableLoading"
    [skeletonColumns]="displayedColumns.length"
    [showFilter]="true"
    filterPlaceholder="Search transfers..."
    [hasFooter]="true"
    (filterChange)="onGridFilter($event)"
  >
    <table mat-table [dataSource]="dataSource" matSort>
      <ng-container matColumnDef="transferId">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Transfer ID</th>
        <td mat-cell *matCellDef="let transfer">{{ transfer.id }}</td>
      </ng-container>

      <ng-container matColumnDef="fromBranch">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>From</th>
        <td mat-cell *matCellDef="let transfer">{{ transfer.fromBranchName }}</td>
      </ng-container>

      <ng-container matColumnDef="toBranch">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>To</th>
        <td mat-cell *matCellDef="let transfer">{{ transfer.toBranchName }}</td>
      </ng-container>

      <ng-container matColumnDef="items">
        <th mat-header-cell *matHeaderCellDef>Items</th>
        <td mat-cell *matCellDef="let transfer">{{ transfer.items.length }}</td>
      </ng-container>

      <ng-container matColumnDef="requestDate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Request Date</th>
        <td mat-cell *matCellDef="let transfer">{{ transfer.requestDate | date }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
        <td mat-cell *matCellDef="let transfer">
          <mx-badge [tone]="getStatusTone(transfer.status)">{{ transfer.status }}</mx-badge>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let transfer">
          <mx-button
            variant="ghost"
            tone="primary"
            icon="visibility"
            [iconOnly]="true"
            (pressed)="viewTransferDetail(transfer)"
          ></mx-button>
          <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Actions">
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu">
            <button
              mat-menu-item
              *ngIf="transfer.status === Status.Pending"
              (click)="updateStatus(transfer, Status.Approved)"
            >
              <mat-icon>check_circle</mat-icon>
              <span>Approve</span>
            </button>
            <button
              mat-menu-item
              *ngIf="transfer.status === Status.Approved"
              (click)="updateStatus(transfer, Status.InTransit)"
            >
              <mat-icon>local_shipping</mat-icon>
              <span>Mark In Transit</span>
            </button>
            <button
              mat-menu-item
              *ngIf="transfer.status === Status.InTransit"
              (click)="updateStatus(transfer, Status.Completed)"
            >
              <mat-icon>done_all</mat-icon>
              <span>Complete Transfer</span>
            </button>
            <button
              mat-menu-item
              *ngIf="transfer.status === Status.Pending"
              (click)="updateStatus(transfer, Status.Rejected)"
            >
              <mat-icon>cancel</mat-icon>
              <span>Reject</span>
            </button>
          </mat-menu>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="7">
          <mx-empty-state
            title="No transfers found"
            description="Try another filter or create a new transfer."
            icon="swap_horiz"
            [compact]="true"
          ></mx-empty-state>
        </td>
      </tr>
    </table>

    <mat-paginator
      mxGridFooter
      [pageSizeOptions]="[5, 10, 25, 100]"
      aria-label="Select page of transfers"
    ></mat-paginator>
  </mx-grid>
</div>
