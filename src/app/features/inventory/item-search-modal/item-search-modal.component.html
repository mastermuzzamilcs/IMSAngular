<h2 mat-dialog-title>Search Product</h2>
<mat-dialog-content>
  <form [formGroup]="searchForm">
    <div class="form-row three-columns">
      <!-- Brand Dropdown -->
      <mat-form-field appearance="outline">
        <mat-label>Brand</mat-label>
        <mat-select formControlName="brandId">
          <mat-option *ngFor="let brand of brands" [value]="brand.id">
            {{ brand.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Product Name Input -->
      <mat-form-field appearance="outline">
        <mat-label>Product Name</mat-label>
        <input matInput formControlName="name" placeholder="Enter product name" />
      </mat-form-field>

      <!-- Description Input -->
      <mat-form-field appearance="outline">
        <mat-label>Description</mat-label>
        <input matInput formControlName="description" placeholder="Enter description" />
      </mat-form-field>
    </div>

    <div class="form-row">
      <button mat-raised-button color="primary" (click)="searchProducts()" type="button">
        <mat-icon>search</mat-icon> Search
      </button>
    </div>
  </form>

  <!-- Search Result Table -->
  <!-- <div class="mat-elevation-z2 table-container mt-3" *ngIf="productList.length"> -->
  <table mat-table [dataSource]="productList" class="full-width">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Product</th>
      <td mat-cell *matCellDef="let row">{{ row.name }}</td>
    </ng-container>

    <ng-container matColumnDef="brand">
      <th mat-header-cell *matHeaderCellDef>Brand</th>
      <td mat-cell *matCellDef="let row">{{ row.brand }}</td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let row">{{ row.description }}</td>
    </ng-container>

    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef>Unit Price</th>
      <td mat-cell *matCellDef="let row">{{ row.price | number: '1.2-2' }}</td>
    </ng-container>

    <!-- <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button color="primary" (click)="selectItem(row)">
            <mat-icon>check_circle</mat-icon>
          </button>
        </td>
      </ng-container> -->

    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef>
        <mat-checkbox
          (change)="$event ? masterToggle() : null"
          [checked]="selection.hasValue() && isAllSelected()"
          [indeterminate]="selection.hasValue() && !isAllSelected()"
        >
        </mat-checkbox>
      </th>
      <td mat-cell *matCellDef="let row">
        <mat-checkbox
          (click)="$event.stopPropagation()"
          (change)="$event ? selection.toggle(row) : null"
          [checked]="selection.isSelected(row)"
        >
        </mat-checkbox>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns"
      [class.selected]="selectedProduct === row"
      (click)="selectRow(row)"
    ></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="5">No products found.</td>
    </tr>
  </table>
  <!-- </div> -->
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-raised-button color="primary" (click)="onConfirm()">Confirm</button>
  <button mat-button (click)="onCancel()">Close</button>
</mat-dialog-actions>
