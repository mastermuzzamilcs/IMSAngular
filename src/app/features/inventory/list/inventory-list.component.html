<div class="container">
  <div class="header-container">
    <h1 class="mat-headline-5">Inventory Overview</h1>
    <mat-form-field appearance="outline" class="branch-select">
      <mat-label>Select Branch</mat-label>
      <mat-select [(value)]="selectedBranchId" (selectionChange)="filterByBranch()">
        <mat-option *ngFor="let branch of branches" [value]="branch.branchid">
          {{ branch.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <div class="actions">
      <button mat-raised-button color="primary" [routerLink]="['/inventory/stock-in']">
        <mat-icon>add_box</mat-icon> Stock In
      </button>
      <button mat-raised-button color="warn" [routerLink]="['/inventory/stock-out']">
        <mat-icon>indeterminate_check_box</mat-icon> Stock Out
      </button>
    </div>
  </div>

  <mat-card>
    <mat-card-content>
      <mat-form-field appearance="outline" class="filter-field">
        <mat-label>Filter</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Search by product name..." />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>

      <div class="mat-elevation-z2 table-container">
        <table mat-table [dataSource]="dataSource" matSort>
          <ng-container matColumnDef="branchName">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Branch</th>
            <td mat-cell *matCellDef="let stock">{{ stock.branchName }}</td>
          </ng-container>

          <ng-container matColumnDef="productName">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Product</th>
            <td mat-cell *matCellDef="let stock">{{ stock.productName }}</td>
          </ng-container>

          <ng-container matColumnDef="brand">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Brand</th>
            <td mat-cell *matCellDef="let stock">{{ stock.brandName }}</td>
          </ng-container>

          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Description</th>
            <td mat-cell *matCellDef="let stock">{{ stock.description }}</td>
          </ng-container>

          <ng-container matColumnDef="price">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Price</th>
            <td mat-cell *matCellDef="let stock">{{ stock.price }}</td>
          </ng-container>

          <ng-container matColumnDef="quantity">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Quantity</th>
            <td mat-cell *matCellDef="let stock">{{ stock.quantity }}</td>
          </ng-container>

          <ng-container matColumnDef="alert">
            <th mat-header-cell *matHeaderCellDef>status</th>
            <td mat-cell *matCellDef="let stock">
              <span
                class="badge"
                [ngClass]="{
                  'badge-empty': stock.alert === 'Empty',
                  'badge-low': stock.alert === 'Low',
                  'badge-healthy': stock.alert === 'Healthy',
                }"
                >{{ stock.alert }}</span
              >
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="5">No stock data found.</td>
          </tr>
        </table>

        <mat-paginator
          [pageSizeOptions]="[5, 10, 25, 100]"
          aria-label="Select page of stock overview"
        ></mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
