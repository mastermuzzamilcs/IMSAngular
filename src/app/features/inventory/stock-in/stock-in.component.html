<div class="container">
  <mx-page-header title="Stock In" subtitle="Receive inventory into a branch">
    <mx-button
      variant="outline"
      tone="primary"
      icon="add"
      *appPrivilege="privileges.stockIn.create"
      (pressed)="openProductDialog()"
      >Add Item</mx-button
    >
  </mx-page-header>

  <mx-card padding="md" elevation="elevated" class="form-surface">
    <form [formGroup]="stockInForm" class="form-fields">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Vendor</mat-label>
        <mat-select formControlName="vendor">
          <mat-option *ngFor="let vendor of vendors" [value]="vendor.id">
            {{ vendor.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Stock In Date</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="date" />
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>
    </form>

    <mx-grid [showFilter]="false" [elevated]="false">
      <table mat-table [dataSource]="dataSource">
        <ng-container matColumnDef="product">
          <th mat-header-cell *matHeaderCellDef>Product</th>
          <td mat-cell *matCellDef="let row">{{ row.name }}</td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let row">{{ row.description }}</td>
        </ng-container>

        <ng-container matColumnDef="quantity">
          <th mat-header-cell *matHeaderCellDef>Quantity</th>
          <td mat-cell *matCellDef="let row">
            <input
              matInput
              type="number"
              [(ngModel)]="row.quantity"
              (ngModelChange)="updateRowTotal(row)"
            />
          </td>
        </ng-container>

        <ng-container matColumnDef="unitPrice">
          <th mat-header-cell *matHeaderCellDef>Unit Price</th>
          <td mat-cell *matCellDef="let row">
            <input
              matInput
              type="number"
              [(ngModel)]="row.unitPrice"
              (ngModelChange)="updateRowTotal(row)"
            />
          </td>
        </ng-container>

        <ng-container matColumnDef="discount">
          <th mat-header-cell *matHeaderCellDef>Discount</th>
          <td mat-cell *matCellDef="let row">
            <input
              matInput
              type="number"
              [(ngModel)]="row.discount"
              (ngModelChange)="updateRowTotal(row)"
            />
          </td>
        </ng-container>

        <ng-container matColumnDef="total">
          <th mat-header-cell *matHeaderCellDef>Total</th>
          <td mat-cell *matCellDef="let row">
            {{ row.total | appCurrency: '1.2-2' }}
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let row">
            <mx-button
              variant="ghost"
              tone="danger"
              icon="delete"
              [iconOnly]="true"
              *appPrivilege="privileges.stockIn.delete"
              (pressed)="removeProduct(row)"
            ></mx-button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="7">
            <mx-empty-state
              title="No items added"
              description="Use Add Item to build this stock-in request."
              icon="inventory_2"
              [compact]="true"
            ></mx-empty-state>
          </td>
        </tr>
      </table>
    </mx-grid>

    <div class="summary-panel">
      <div class="summary-row">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Total Items</mat-label>
          <input matInput [value]="dataSource.data.length" readonly />
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Sub Total</mat-label>
          <input matInput [value]="subTotal | appCurrency: '1.2-2'" readonly />
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Discount Type</mat-label>
          <mat-select [(ngModel)]="discountType">
            <mat-option value="amount">Amount</mat-option>
            <mat-option value="percentage">Percentage</mat-option>
          </mat-select>
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Discount Value</mat-label>
          <input
            matInput
            type="number"
            [(ngModel)]="discountValue"
            (ngModelChange)="recalculateTotal()"
          />
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Net Total</mat-label>
          <input matInput [value]="netTotal | appCurrency: '1.2-2'" readonly />
        </mat-form-field>
      </div>
    </div>

    <div class="form-actions">
      <mx-button
        tone="primary"
        *appPrivilege="privileges.stockIn.create"
        (pressed)="submitStockIn()"
          [disabled]="submitting || dataSource.data.length <= 0 || stockInForm.invalid || netTotal <= 0"
      >
        Generate Request
      </mx-button>
    </div>
  </mx-card>
</div>
