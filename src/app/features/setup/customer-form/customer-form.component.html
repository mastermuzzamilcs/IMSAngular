<h2 mat-dialog-title>{{ dialogTitle }}</h2>
<mat-dialog-content>
  <form [formGroup]="customerForm">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" placeholder="Customer name" />
      <mat-error *ngIf="customerForm.get('name')?.hasError('required')">Name is required</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Phone</mat-label>
      <input matInput formControlName="phone" placeholder="Phone" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" placeholder="Email" />
      <mat-error *ngIf="customerForm.get('email')?.hasError('email')"
        >Enter a valid email</mat-error
      >
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Address</mat-label>
      <input matInput formControlName="address" placeholder="Address" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Status</mat-label>
      <mat-select formControlName="status">
        <mat-option [value]="Status.Active">Active</mat-option>
        <mat-option [value]="Status.Inactive">Inactive</mat-option>
      </mat-select>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end" class="form-actions">
  <mx-button variant="outline" tone="neutral" (pressed)="onCancel()">Cancel</mx-button>
  <mx-button tone="primary" (pressed)="onSubmit()">
    {{ data.mode === 'add' ? 'Add' : 'Update' }}
  </mx-button>
</mat-dialog-actions>
