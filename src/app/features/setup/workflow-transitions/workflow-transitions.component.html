<div class="container">
  <mx-page-header title="Status Transitions" subtitle="Configure allowed workflow status changes">
    <mx-button
      variant="outline"
      tone="primary"
      icon="add"
      *appPrivilege="privileges.workflowTransitions.create"
      (pressed)="openAddDialog()"
      >Add Transition</mx-button
    >
  </mx-page-header>

  <mx-grid
    [showFilter]="true"
    filterPlaceholder="Search transitions..."
    [hasFooter]="true"
    (filterChange)="onGridFilter($event)"
  >
    <table mat-table [dataSource]="dataSource" matSort>
      <ng-container matColumnDef="requestType">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Request Type</th>
        <td mat-cell *matCellDef="let row">{{ requestTypeLabel(row.requestType) }}</td>
      </ng-container>

      <ng-container matColumnDef="fromStatus">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>From</th>
        <td mat-cell *matCellDef="let row">{{ row.fromStatus }}</td>
      </ng-container>

      <ng-container matColumnDef="toStatus">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>To</th>
        <td mat-cell *matCellDef="let row">{{ row.toStatus }}</td>
      </ng-container>

      <ng-container matColumnDef="label">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Label</th>
        <td mat-cell *matCellDef="let row">{{ row.label }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let row">
          <mx-button
            variant="ghost"
            tone="primary"
            icon="edit"
            [iconOnly]="true"
            *appPrivilege="privileges.workflowTransitions.edit"
            (pressed)="openEditDialog(row)"
          ></mx-button>
          <mx-button
            variant="ghost"
            tone="danger"
            icon="delete"
            [iconOnly]="true"
            *appPrivilege="privileges.workflowTransitions.delete"
            (pressed)="openDeleteDialog(row)"
          ></mx-button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="5">
          <mx-empty-state
            title="No status transitions found"
            description="Add a transition to get started."
            icon="swap_horiz"
            [compact]="true"
          ></mx-empty-state>
        </td>
      </tr>
    </table>
    <mat-paginator mxGridFooter [pageSizeOptions]="[5, 10, 25, 100]"></mat-paginator>
  </mx-grid>
</div>
