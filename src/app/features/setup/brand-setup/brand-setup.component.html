<div class="container">
  <mx-page-header title="Brands" subtitle="Manage product brands">
    <mx-button
      variant="outline"
      tone="primary"
      icon="add"
      *appPrivilege="privileges.brands.create"
      (pressed)="openAddDialog()"
      >Add Brand</mx-button
    >
  </mx-page-header>

  <mx-grid
    [loading]="tableLoading"
    [skeletonColumns]="displayedColumns.length"
    [showFilter]="true"
    filterPlaceholder="Search brands..."
    [hasFooter]="true"
    (filterChange)="onGridFilter($event)"
  >
    <table mat-table [dataSource]="dataSource" matSort>
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
        <td mat-cell *matCellDef="let role">{{ role.name }}</td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Description</th>
        <td mat-cell *matCellDef="let role">{{ role.description }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
        <td mat-cell *matCellDef="let role">
          <mx-badge [tone]="role.status ? 'success' : 'neutral'">{{ role.status }}</mx-badge>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let role">
          <mx-button
            variant="ghost"
            tone="primary"
            icon="edit"
            [iconOnly]="true"
            *appPrivilege="privileges.brands.edit"
            (pressed)="openEditDialog(role)"
          ></mx-button>
          <mx-button
            variant="ghost"
            tone="danger"
            icon="delete"
            [iconOnly]="true"
            *appPrivilege="privileges.brands.delete"
            (pressed)="openDeleteDialog(role)"
          ></mx-button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="4">
          <mx-empty-state
            title="No brands found"
            description="Add a brand to get started."
            icon="sell"
            [compact]="true"
          ></mx-empty-state>
        </td>
      </tr>
    </table>

    <mat-paginator
      mxGridFooter
      [pageSizeOptions]="[5, 10, 25, 100]"
      aria-label="Select page of brands"
    ></mat-paginator>
  </mx-grid>
</div>
