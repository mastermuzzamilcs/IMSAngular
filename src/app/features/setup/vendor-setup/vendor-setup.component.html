<div class="container">
  <mx-page-header title="Vendors" subtitle="Manage suppliers and vendors">
    <mx-button variant="outline" tone="primary" icon="add" (pressed)="openAddDialog()"
      >Add Vendor</mx-button
    >
  </mx-page-header>

  <mx-grid
    [showFilter]="true"
    filterPlaceholder="Search vendors..."
    [hasFooter]="true"
    (filterChange)="onGridFilter($event)"
  >
    <table mat-table [dataSource]="dataSource" matSort>
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
        <td mat-cell *matCellDef="let vendor">{{ vendor.name }}</td>
      </ng-container>

      <ng-container matColumnDef="location">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Location</th>
        <td mat-cell *matCellDef="let vendor">{{ vendor.location }}</td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Description</th>
        <td mat-cell *matCellDef="let vendor">{{ vendor.description }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
        <td mat-cell *matCellDef="let vendor">
          <mx-badge [tone]="vendor.status ? 'success' : 'neutral'">{{ vendor.status }}</mx-badge>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let vendor">
          <mx-button
            variant="ghost"
            tone="primary"
            icon="edit"
            [iconOnly]="true"
            (pressed)="openEditDialog(vendor)"
          ></mx-button>
          <mx-button
            variant="ghost"
            tone="danger"
            icon="delete"
            [iconOnly]="true"
            (pressed)="openDeleteDialog(vendor)"
          ></mx-button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="5">
          <mx-empty-state
            title="No vendors found"
            description="Add a vendor to get started."
            icon="local_shipping"
            [compact]="true"
          ></mx-empty-state>
        </td>
      </tr>
    </table>

    <mat-paginator
      mxGridFooter
      [pageSizeOptions]="[5, 10, 25, 100]"
      aria-label="Select page of Vendors"
    ></mat-paginator>
  </mx-grid>
</div>
