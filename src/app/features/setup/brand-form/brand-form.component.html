<h2 mat-dialog-title>{{ dialogTitle }}</h2>

<mat-dialog-content>
  <form [formGroup]="brandForm">
    <div class="form-row">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Brand Title</mat-label>
        <input matInput formControlName="name" placeholder="Enter Title" />
        <mat-error *ngIf="brandForm.get('name')?.hasError('required')">
          Title is required
        </mat-error>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Alias</mat-label>
        <input matInput formControlName="alias" placeholder="Enter Alias" />
        <mat-error *ngIf="brandForm.get('alias')?.hasError('required')">
          Alias is required
        </mat-error>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Description</mat-label>
        <input matInput formControlName="description" placeholder="Description" />
        <mat-error *ngIf="brandForm.get('description')?.hasError('required')">
          Description is required
        </mat-error>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Country</mat-label>
        <input matInput formControlName="country" placeholder="Enter Country" />
        <mat-error *ngIf="brandForm.get('country')?.hasError('required')">
          Country is required
        </mat-error>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Status</mat-label>
        <mat-select formControlName="status">
          <mat-option value="active">Active</mat-option>
          <mat-option value="inactive">Inactive</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="brandForm.invalid">
    {{ data.mode === 'add' ? 'Add' : 'Update' }}
  </button>
</mat-dialog-actions>
