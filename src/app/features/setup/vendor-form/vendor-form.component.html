<h2 class="mx-dialog-title">{{ dialogTitle }}</h2>

<div class="mx-dialog-body">
  <form [formGroup]="VendorForm">
    <div class="form-row">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" placeholder="Enter Name" />
        <mat-error *ngIf="VendorForm.get('name')?.hasError('required')">
          Name is required
        </mat-error>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Location</mat-label>
        <input matInput formControlName="location" placeholder="Location" />
        <mat-error *ngIf="VendorForm.get('location')?.hasError('required')">
          Location is required
        </mat-error>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Description</mat-label>
        <input matInput formControlName="description" placeholder="Description" />
        <mat-error *ngIf="VendorForm.get('description')?.hasError('required')">
          Description is required
        </mat-error>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Status</mat-label>
        <mat-select formControlName="status">
          <mat-option value="active">Active</mat-option>
          <mat-option value="inactive">Inactive</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </form>
</div>

<div class="mx-dialog-actions" class="form-actions">
  <mx-button variant="outline" tone="neutral" (pressed)="onCancel()">Cancel</mx-button>
  <mx-button tone="primary" (pressed)="onSubmit()" [disabled]="VendorForm.invalid">
    {{ data.mode === 'add' ? 'Add' : 'Update' }}
  </mx-button>
</div>
