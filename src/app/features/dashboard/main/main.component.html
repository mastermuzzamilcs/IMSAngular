<div class="dashboard-container">
  <h1>Dashboard</h1>

  <!-- KPI Cards Row -->
  <div class="kpi-cards flexible-row-container">
    <mat-card class="kpi-card">
      <mat-card-content>
        <div class="kpi-icon">
          <mat-icon>inventory_2</mat-icon>
        </div>
        <div class="kpi-info">
          <h3>Total Inventory</h3>
          <p class="kpi-value">128</p>
        </div>
      </mat-card-content>
    </mat-card>

    <mat-card class="kpi-card">
      <mat-card-content>
        <div class="kpi-icon">
          <mat-icon>priority_high</mat-icon>
        </div>
        <div class="kpi-info">
          <h3>Low Stock Items</h3>
          <p class="kpi-value">12</p>
        </div>
      </mat-card-content>
    </mat-card>

    <mat-card class="kpi-card">
      <mat-card-content>
        <div class="kpi-icon">
          <mat-icon>swap_horiz</mat-icon>
        </div>
        <div class="kpi-info">
          <h3>Pending Transfers</h3>
          <p class="kpi-value">5</p>
        </div>
      </mat-card-content>
    </mat-card>

    <mat-card class="kpi-card">
      <mat-card-content>
        <div class="kpi-icon">
          <mat-icon>point_of_sale</mat-icon>
        </div>
        <div class="kpi-info">
          <h3>Today's Sales</h3>
          <p class="kpi-value">$4,520</p>
        </div>
      </mat-card-content>
    </mat-card>
  </div>

  <!-- Charts Row -->
  <div class="charts-row flexible-Chart-container">
    <mat-card class="chart-card">
      <mat-card-header>
        <mat-card-title>Sales Trend</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <canvas id="salesChart"></canvas>
      </mat-card-content>
    </mat-card>

    <mat-card class="chart-card">
      <mat-card-header>
        <mat-card-title>Inventory by Branch</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <canvas id="inventoryChart"></canvas>
      </mat-card-content>
    </mat-card>
  </div>

  <!-- Recent Activity -->
  <mat-card class="activity-card">
    <mat-card-header>
      <mat-card-title>Recent Activity</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <mat-list>
        <mat-list-item>
          <mat-icon matListItemIcon>swap_horiz</mat-icon>
          <div matListItemTitle>Transfer #1082 created</div>
          <div matListItemLine>From Branch A to Branch B</div>
          <div matListItemMeta>10 minutes ago</div>
        </mat-list-item>
        <mat-divider></mat-divider>
        <!-- More activity items -->
      </mat-list>
    </mat-card-content>
  </mat-card>
</div>
