<div class="dashboard-container">
  <mx-page-header title="Dashboard" subtitle="Inventory overview and recent activity"></mx-page-header>

  <div class="kpi-cards flexible-row-container">
    <mx-card class="kpi-card" padding="md" elevation="elevated">
      <div class="kpi-row">
        <div class="kpi-icon">
          <mat-icon>inventory_2</mat-icon>
        </div>
        <div class="kpi-info">
          <h3>Total Inventory</h3>
          <p class="kpi-value">128</p>
        </div>
      </div>
    </mx-card>

    <mx-card class="kpi-card" padding="md" elevation="elevated">
      <div class="kpi-row">
        <div class="kpi-icon">
          <mat-icon>priority_high</mat-icon>
        </div>
        <div class="kpi-info">
          <h3>Low Stock Items</h3>
          <p class="kpi-value">12</p>
        </div>
      </div>
    </mx-card>

    <mx-card class="kpi-card" padding="md" elevation="elevated">
      <div class="kpi-row">
        <div class="kpi-icon">
          <mat-icon>swap_horiz</mat-icon>
        </div>
        <div class="kpi-info">
          <h3>Pending Transfers</h3>
          <p class="kpi-value">5</p>
        </div>
      </div>
    </mx-card>

    <mx-card class="kpi-card" padding="md" elevation="elevated">
      <div class="kpi-row">
        <div class="kpi-icon">
          <mat-icon>point_of_sale</mat-icon>
        </div>
        <div class="kpi-info">
          <h3>Today's Sales</h3>
          <p class="kpi-value">$4,520</p>
        </div>
      </div>
    </mx-card>
  </div>

  <div class="charts-row flexible-Chart-container">
    <mx-card title="Sales Trend" padding="md" elevation="elevated" class="chart-card">
      <canvas id="salesChart"></canvas>
    </mx-card>

    <mx-card title="Inventory by Branch" padding="md" elevation="elevated" class="chart-card">
      <canvas id="inventoryChart"></canvas>
    </mx-card>
  </div>

  <mx-card title="Recent Activity" padding="md" elevation="elevated" class="activity-card">
    <mat-list>
      <mat-list-item>
        <mat-icon matListItemIcon>swap_horiz</mat-icon>
        <div matListItemTitle>Transfer #1082 created</div>
        <div matListItemLine>From Branch A to Branch B</div>
        <div matListItemMeta>10 minutes ago</div>
      </mat-list-item>
      <mat-divider></mat-divider>
    </mat-list>
  </mx-card>
</div>
