<div class="container">
  <mx-page-header title="Settings" subtitle="App appearance, tables, and notification sound"></mx-page-header>

  <mat-card>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="save()">
        <h3>Appearance</h3>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Title</mat-label>
          <input matInput formControlName="title" maxlength="60" />
          <mat-hint>Shown next to the logo in the top-left sidenav</mat-hint>
          <mat-error *ngIf="form.get('title')?.hasError('required')">Title is required</mat-error>
        </mat-form-field>

        <div class="logo-block">
          <div class="logo-preview">
            <img [src]="logoPreview" alt="App logo preview" />
          </div>
          <div class="logo-actions">
            <button mat-stroked-button type="button" (click)="logoInput.click()">
              <mat-icon>image</mat-icon>
              Choose image
            </button>
            <button mat-button type="button" (click)="clearLogo()">Reset to default</button>
            <input
              #logoInput
              type="file"
              accept="image/*"
              hidden
              (change)="onLogoSelected($event)"
            />
            <p class="hint">Uploaded image is stored locally and used as the IMS logo.</p>
          </div>
        </div>

        <h3>Tables</h3>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Default page size</mat-label>
          <mat-select formControlName="pageSize">
            <mat-option *ngFor="let size of pageSizeOptions" [value]="size">{{ size }}</mat-option>
          </mat-select>
          <mat-hint>Used by paginated lists across the application</mat-hint>
        </mat-form-field>

        <h3>Notification sound</h3>
        <div class="sound-row">
          <mat-slide-toggle formControlName="soundEnabled"
            >Enable notification sound</mat-slide-toggle
          >
        </div>
        <div class="sound-pick">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Sound</mat-label>
            <mat-select formControlName="soundId">
              <mat-option *ngFor="let option of sounds" [value]="option.id">
                {{ option.label }}
              </mat-option>
            </mat-select>
          </mat-form-field>
          <button mat-stroked-button type="button" (click)="previewSound()">
            <mat-icon>play_arrow</mat-icon>
            Preview
          </button>
        </div>

        <div class="actions">
          <button mat-raised-button color="primary" type="submit">Save</button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
