<div class="container">
  <mx-page-header
    title="Workflow Requests"
    subtitle="Review and process pending workflow requests"
  ></mx-page-header>

  <mx-grid
    [loading]="tableLoading"
    [skeletonColumns]="displayedColumns.length"
    [showFilter]="true"
    filterPlaceholder="Search requests..."
    [hasFooter]="true"
    (filterChange)="onGridFilter($event)"
  >
    <table mat-table [dataSource]="dataSource" matSort>
      <ng-container matColumnDef="requestedOn">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Date</th>
        <td mat-cell *matCellDef="let r">{{ r.requestedOn | date: 'short' }}</td>
      </ng-container>

      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Type</th>
        <td mat-cell *matCellDef="let r">{{ r.requestType }}</td>
      </ng-container>

      <ng-container matColumnDef="branchName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Branch</th>
        <td mat-cell *matCellDef="let r">{{ r.branchName }}</td>
      </ng-container>

      <ng-container matColumnDef="requestedBy">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Requested By</th>
        <td mat-cell *matCellDef="let r">{{ r.requestedByName }}</td>
      </ng-container>

      <ng-container matColumnDef="assignedTo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Assigned To</th>
        <td mat-cell *matCellDef="let r">{{ r.assignedToName }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let r">
          <mx-badge
            [tone]="
              r.status === Status.Rejected
                ? 'danger'
                : r.status === Status.Pending
                  ? 'warning'
                  : 'primary'
            "
            >{{ r.status }}</mx-badge
          >
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
        (dblclick)="onRowDblClick(row)"
      ></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="6">
          <mx-empty-state
            title="No requests found"
            description="There are no workflow requests to display."
            icon="assignment"
            [compact]="true"
          ></mx-empty-state>
        </td>
      </tr>
    </table>

    <mat-paginator
      mxGridFooter
      [pageSizeOptions]="[5, 10, 25]"
      showFirstLastButtons
    ></mat-paginator>
  </mx-grid>
</div>
