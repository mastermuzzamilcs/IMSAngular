<mat-card class="request-card">
  <mat-card-title>Workflow Requests</mat-card-title>
  <mat-divider></mat-divider>

  <div class="table-container">
    <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z2">
      <!-- Stock ID -->
      <ng-container matColumnDef="stockId">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Stock ID</th>
        <td mat-cell *matCellDef="let r">{{ r.moduleId }}</td>
      </ng-container>

      <!-- Type -->
      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Type</th>
        <td mat-cell *matCellDef="let r">{{ r.requestType }}</td>
      </ng-container>

      <!-- Requested By -->
      <ng-container matColumnDef="requestedBy">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Requested By</th>
        <td mat-cell *matCellDef="let r">{{ r.requestedBy }}</td>
      </ng-container>

      <!-- Date -->
      <ng-container matColumnDef="requestedOn">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Date</th>
        <td mat-cell *matCellDef="let r">{{ r.requestedOn | date: 'short' }}</td>
      </ng-container>

      <!-- Status -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let r">
          <mat-chip [color]="r.status === 'Pending' ? 'warn' : 'primary'" selected>{{
            r.status
          }}</mat-chip>
        </td>
      </ng-container>

      <!-- Actions -->
      <!-- <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let r">
            <button mat-icon-button color="primary" (click)="confirmApprove(r)">
              <mat-icon>check</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="confirmReject(r)">
              <mat-icon>close</mat-icon>
            </button>
          </td>
        </ng-container> -->

      <!-- Header and Rows -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
        (dblclick)="onRowDblClick(row)"
      ></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="6">
          <div class="empty-state">No Data Found.</div>
        </td>
      </tr>
    </table>
  </div>

  <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>
</mat-card>
