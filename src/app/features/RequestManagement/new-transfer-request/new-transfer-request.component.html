<div class="container">
  <mx-page-header title="New Transfer Request" subtitle="Move stock between branches">
    <mx-button variant="outline" tone="primary" icon="add" (pressed)="openProductDialog()"
      >Add Item</mx-button
    >
  </mx-page-header>

  <mx-card padding="md" elevation="elevated" class="form-surface">
    <form [formGroup]="transferForm" class="form-fields">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Branch</mat-label>
        <mat-select formControlName="branch" (selectionChange)="onBranchChange()">
          <mat-option *ngFor="let branch of branches" [value]="branch.branchid">
            {{ branch.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>User</mat-label>
        <mat-select formControlName="user">
          <mat-option *ngFor="let user of usersForBranch" [value]="user.userid">
            {{ user.name }} ({{ user.branchName }})
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Date</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="date" />
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>
    </form>

    <mx-grid [showFilter]="false" [elevated]="false">
      <table mat-table [dataSource]="dataSource">
        <ng-container matColumnDef="product">
          <th mat-header-cell *matHeaderCellDef>Product</th>
          <td mat-cell *matCellDef="let row">{{ row.name }}</td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let row">{{ row.description }}</td>
        </ng-container>

        <ng-container matColumnDef="quantity">
          <th mat-header-cell *matHeaderCellDef>Quantity</th>
          <td mat-cell *matCellDef="let row">
            <input matInput type="number" [(ngModel)]="row.quantity" />
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let row">
            <mx-button
              variant="ghost"
              tone="danger"
              icon="delete"
              [iconOnly]="true"
              (pressed)="removeProduct(row)"
            ></mx-button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4">
            <mx-empty-state
              title="No items added"
              description="Use Add Item to build this transfer."
              icon="swap_horiz"
              [compact]="true"
            ></mx-empty-state>
          </td>
        </tr>
      </table>
    </mx-grid>

    <div class="form-actions">
      <mx-button
        tone="primary"
        (pressed)="submitTransfer()"
        [disabled]="dataSource.data.length <= 0 || transferForm.invalid"
      >
        Generate Request
      </mx-button>
    </div>
  </mx-card>
</div>
