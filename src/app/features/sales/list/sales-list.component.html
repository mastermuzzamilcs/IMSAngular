<div class="container">
  <mx-page-header title="Sales Tracking" subtitle="View and record sales">
    <mat-button-toggle-group [value]="dateRange" (change)="onDateRangeChange($event.value)">
      <mat-button-toggle value="day">Today</mat-button-toggle>
      <mat-button-toggle value="week">This Week</mat-button-toggle>
      <mat-button-toggle value="month">This Month</mat-button-toggle>
    </mat-button-toggle-group>
    <mx-button variant="outline" tone="primary" icon="add" (pressed)="openNewSale()"
      >New Sale</mx-button
    >
  </mx-page-header>

  <mx-grid
    [showFilter]="true"
    filterPlaceholder="Search sales..."
    [hasFooter]="true"
    (filterChange)="onGridFilter($event)"
  >
    <table mat-table [dataSource]="dataSource" matSort>
      <ng-container matColumnDef="saleId">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Sale ID</th>
        <td mat-cell *matCellDef="let sale">{{ sale.saleId }}</td>
      </ng-container>

      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Date</th>
        <td mat-cell *matCellDef="let sale">{{ sale.date | date: 'medium' }}</td>
      </ng-container>

      <ng-container matColumnDef="customer">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Customer</th>
        <td mat-cell *matCellDef="let sale">{{ sale.customer }}</td>
      </ng-container>

      <ng-container matColumnDef="items">
        <th mat-header-cell *matHeaderCellDef>Items</th>
        <td mat-cell *matCellDef="let sale">{{ sale.items.length }}</td>
      </ng-container>

      <ng-container matColumnDef="total">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Total</th>
        <td mat-cell *matCellDef="let sale">{{ sale.total | appCurrency }}</td>
      </ng-container>

      <ng-container matColumnDef="paymentMethod">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Payment</th>
        <td mat-cell *matCellDef="let sale">{{ sale.paymentMethod }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
        <td mat-cell *matCellDef="let sale">
          <mx-badge [tone]="sale.status === Status.Completed ? 'success' : 'info'">
            {{ sale.status }}
          </mx-badge>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let sale">
          <mx-button
            variant="ghost"
            tone="primary"
            icon="visibility"
            [iconOnly]="true"
            *appPrivilege="privileges.salesOverview.details"
          ></mx-button>
          <mx-button variant="ghost" tone="neutral" icon="print" [iconOnly]="true"></mx-button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="8">
          <mx-empty-state
            title="No sales found"
            description="Try another filter or record a new sale."
            icon="point_of_sale"
            [compact]="true"
          ></mx-empty-state>
        </td>
      </tr>
    </table>

    <mat-paginator
      mxGridFooter
      [pageSizeOptions]="[5, 10, 25, 100]"
      aria-label="Select page of sales"
    ></mat-paginator>
  </mx-grid>
</div>
