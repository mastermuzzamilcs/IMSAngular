<div class="container">
  <mx-page-header
    title="Team Hierarchy"
    subtitle="Each user has one reporting relationship"
  ></mx-page-header>

  <mx-card>
    <p>Choose who a user reports to. Each user has one reporting relationship.</p>
    <form [formGroup]="form" style="display: flex; flex-wrap: wrap; gap: 1rem; align-items: center">
      <mat-form-field appearance="outline" style="flex: 1 1 240px">
        <mat-label>User</mat-label>
        <mat-select formControlName="userid">
          <mat-option *ngFor="let user of users" [value]="user.userid">
            {{ user.name }} ({{ user.email }})
          </mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="outline" style="flex: 1 1 240px">
        <mat-label>Reporting To</mat-label>
        <mat-select formControlName="reportingTo">
          <mat-option
            *ngFor="let user of reportingChoices(form.value.userid || '')"
            [value]="user.userid"
          >
            {{ user.name }} ({{ user.email }})
          </mat-option>
        </mat-select>
      </mat-form-field>
      <mx-button
        variant="outline"
        tone="primary"
        icon="account_tree"
        *appPrivilege="privileges.users.edit"
        (pressed)="save()"
        >Save</mx-button
      >
    </form>

    <table mat-table [dataSource]="rows" style="margin-top: 1rem; width: 100%">
      <ng-container matColumnDef="userName">
        <th mat-header-cell *matHeaderCellDef>User</th>
        <td mat-cell *matCellDef="let row">{{ row.userName }}</td>
      </ng-container>
      <ng-container matColumnDef="reportingToName">
        <th mat-header-cell *matHeaderCellDef>Reporting To</th>
        <td mat-cell *matCellDef="let row">{{ row.reportingToName }}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row">
          <mx-button
            variant="ghost"
            tone="danger"
            *appPrivilege="privileges.users.edit"
            (pressed)="remove(row)"
            >Remove</mx-button
          >
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="3">
          <mx-empty-state
            title="No reporting relationships yet"
            description="Save a reporting relationship to get started."
            icon="account_tree"
            [compact]="true"
          ></mx-empty-state>
        </td>
      </tr>
    </table>
  </mx-card>
</div>
