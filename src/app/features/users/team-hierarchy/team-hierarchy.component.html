<div class="container">
  <div class="header-container">
    <h1 class="mat-headline-5">Team Hierarchy</h1>
  </div>
  <mat-card>
    <mat-card-content>
      <p>Choose who a user reports to. Each user has one reporting relationship.</p>
      <form
        [formGroup]="form"
        style="display: flex; flex-wrap: wrap; gap: 1rem; align-items: center"
      >
        <mat-form-field appearance="outline" style="flex: 1 1 240px">
          <mat-label>User</mat-label>
          <mat-select formControlName="userid">
            <mat-option *ngFor="let user of users" [value]="user.userid">
              {{ user.name }} ({{ user.email }})
            </mat-option>
          </mat-select>
        </mat-form-field>
        <mat-form-field appearance="outline" style="flex: 1 1 240px">
          <mat-label>Reporting To</mat-label>
          <mat-select formControlName="reportingTo">
            <mat-option
              *ngFor="let user of reportingChoices(form.value.userid || '')"
              [value]="user.userid"
            >
              {{ user.name }} ({{ user.email }})
            </mat-option>
          </mat-select>
        </mat-form-field>
        <button
          mat-raised-button
          color="primary"
          type="button"
          *appPrivilege="privileges.users.edit"
          (click)="save()"
        >
          <mat-icon>account_tree</mat-icon>
          Save
        </button>
      </form>

      <table mat-table [dataSource]="rows" class="mat-elevation-z1" style="margin-top: 1rem">
        <ng-container matColumnDef="userName">
          <th mat-header-cell *matHeaderCellDef>User</th>
          <td mat-cell *matCellDef="let row">{{ row.userName }}</td>
        </ng-container>
        <ng-container matColumnDef="reportingToName">
          <th mat-header-cell *matHeaderCellDef>Reporting To</th>
          <td mat-cell *matCellDef="let row">{{ row.reportingToName }}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let row">
            <button
              mat-button
              color="warn"
              type="button"
              *appPrivilege="privileges.users.edit"
              (click)="remove(row)"
            >
              Remove
            </button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="3">No reporting relationships yet.</td>
        </tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
