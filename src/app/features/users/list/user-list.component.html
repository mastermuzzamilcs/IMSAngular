<div class="container">
  <mx-page-header title="User Management" subtitle="Manage users, roles, and branches">
    <mx-button
      variant="outline"
      tone="primary"
      icon="person_add"
      *appPrivilege="privileges.users.create"
      (pressed)="openAddUserDialog()"
      >Add User</mx-button
    >
  </mx-page-header>

  <mx-grid
    [loading]="tableLoading"
    [skeletonColumns]="displayedColumns.length"
    [showFilter]="true"
    filterPlaceholder="Search users..."
    [hasFooter]="true"
    (filterChange)="onGridFilter($event)"
  >
    <table mat-table [dataSource]="dataSource" matSort>
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
        <td mat-cell *matCellDef="let user">{{ user.name }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
        <td mat-cell *matCellDef="let user">{{ user.email }}</td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Role</th>
        <td mat-cell *matCellDef="let user">
          <mx-badge [tone]="getRoleTone(user.role)">{{ user.role }}</mx-badge>
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
        <td mat-cell *matCellDef="let user">
          <mx-badge
            [tone]="user.status === 'Active' || user.status === true ? 'success' : 'neutral'"
          >
            {{ user.status }}
          </mx-badge>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let user">
          <mx-button
            variant="ghost"
            tone="primary"
            icon="edit"
            [iconOnly]="true"
            *appPrivilege="privileges.users.edit"
            (pressed)="openEditUserDialog(user)"
          ></mx-button>
          <mx-button
            variant="ghost"
            tone="neutral"
            icon="lock_reset"
            [iconOnly]="true"
            (pressed)="ResetPasswordAction(user)"
          ></mx-button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="5">
          <mx-empty-state
            title="No users found"
            description="Try another filter or add a new user."
            icon="people"
            [compact]="true"
          ></mx-empty-state>
        </td>
      </tr>
    </table>

    <mat-paginator
      mxGridFooter
      [pageSizeOptions]="[5, 10, 25, 100]"
      aria-label="Select page of users"
    ></mat-paginator>
  </mx-grid>
</div>
