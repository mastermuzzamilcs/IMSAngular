<div class="container">
  <div class="header-container">
    <h1 class="mat-headline-5">User Groups</h1>
    <button
      mat-raised-button
      color="primary"
      type="button"
      *appPrivilege="privileges.userGroups.create"
      (click)="openAddDialog()"
    >
      <mat-icon>group_add</mat-icon>
      Add Group
    </button>
  </div>
  <mat-card>
    <mat-card-content>
      <p>
        App-level groups such as Admin and Operations. Page and button access is set in Group
        Privileges.
      </p>
      <div class="mat-elevation-z2 table-container">
        <table mat-table [dataSource]="dataSource" matSort>
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
            <td mat-cell *matCellDef="let group">{{ group.name }}</td>
          </ng-container>
          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Description</th>
            <td mat-cell *matCellDef="let group">{{ group.description }}</td>
          </ng-container>
          <ng-container matColumnDef="canApprove">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Can approve</th>
            <td mat-cell *matCellDef="let group">{{ group.canApprove ? 'Yes' : 'No' }}</td>
          </ng-container>
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
            <td mat-cell *matCellDef="let group">
              <mat-chip selected>{{ group.status }}</mat-chip>
            </td>
          </ng-container>
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let group">
              <button
                mat-icon-button
                color="primary"
                type="button"
                *appPrivilege="privileges.userGroups.edit"
                (click)="openEditDialog(group)"
                matTooltip="Edit"
              >
                <mat-icon>edit</mat-icon>
              </button>
              <button
                mat-icon-button
                color="warn"
                type="button"
                *appPrivilege="privileges.userGroups.delete"
                (click)="openDeleteDialog(group)"
                matTooltip="Delete"
              >
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="5">No user groups found</td>
          </tr>
        </table>
        <mat-paginator [pageSizeOptions]="[5, 10, 25]" aria-label="Select page of user groups">
        </mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
