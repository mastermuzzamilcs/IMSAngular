<div class="container">
  <mx-page-header
    title="User Branch Associations"
    subtitle="Assign users to one or more branches"
  ></mx-page-header>

  <mx-card>
    <p>
      Assign a user to one or more branches. All branches lets that user sign in to every branch. A
      user is not limited to a single branch.
    </p>
    <form
      [formGroup]="associationForm"
      style="display: flex; flex-wrap: wrap; gap: 1rem; align-items: center"
    >
      <mat-form-field appearance="outline" style="flex: 1 1 240px">
        <mat-label>User</mat-label>
        <mat-select formControlName="userid">
          <mat-option *ngFor="let user of users" [value]="user.userid">
            {{ user.name }} ({{ user.email }})
          </mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="outline" style="flex: 1 1 220px">
        <mat-label>Branch</mat-label>
        <mat-select formControlName="branchid">
          <mat-option [value]="allBranchesId">All branches</mat-option>
          <mat-option *ngFor="let branch of branches" [value]="branch.branchid">
            {{ branch.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>
      <mx-button
        variant="outline"
        tone="primary"
        icon="add_business"
        *appPrivilege="privileges.users.edit"
        (pressed)="associate()"
        >Assign</mx-button
      >
    </form>

    <table mat-table [dataSource]="associations" style="margin-top: 1rem; width: 100%">
      <ng-container matColumnDef="userName">
        <th mat-header-cell *matHeaderCellDef>User</th>
        <td mat-cell *matCellDef="let row">{{ row.userName }}</td>
      </ng-container>
      <ng-container matColumnDef="branchName">
        <th mat-header-cell *matHeaderCellDef>Branch</th>
        <td mat-cell *matCellDef="let row">{{ row.branchName }}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row">
          <mx-button
            variant="ghost"
            tone="danger"
            *appPrivilege="privileges.users.edit"
            (pressed)="remove(row)"
            >Remove</mx-button
          >
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="3">
          <mx-empty-state
            title="No branch assignments yet"
            description="Assign a user to a branch."
            icon="store"
            [compact]="true"
          ></mx-empty-state>
        </td>
      </tr>
    </table>
  </mx-card>
</div>
