<h2 class="mx-dialog-title">{{ title }}</h2>
<div class="mx-dialog-body">
  <form [formGroup]="searchForm">
    <div style="display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 0.5rem">
      <mat-form-field appearance="outline" subscriptSizing="dynamic" style="flex: 1 1 180px">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" placeholder="Name" />
      </mat-form-field>
      <mat-form-field
        appearance="outline"
        subscriptSizing="dynamic"
        style="flex: 1 1 160px"
        *ngIf="type === 'Customers'"
      >
        <mat-label>Phone</mat-label>
        <input matInput formControlName="phone" placeholder="Phone" />
      </mat-form-field>
      <mat-form-field appearance="outline" subscriptSizing="dynamic" style="flex: 1 1 200px">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" placeholder="Email" />
      </mat-form-field>
    </div>
  </form>

  <div style="overflow-x: auto; margin-top: 1.5rem">
    <table mat-table [dataSource]="rows" class="full-width">
      <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row" (click)="$event.stopPropagation()">
          <mat-checkbox [checked]="isSelected(row)" (change)="toggle(row)"></mat-checkbox>
        </td>
      </ng-container>
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let row">{{ row.name }}</td>
      </ng-container>
      <ng-container matColumnDef="phone">
        <th mat-header-cell *matHeaderCellDef>Phone</th>
        <td mat-cell *matCellDef="let row">{{ row.phone }}</td>
      </ng-container>
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let row">{{ row.email }}</td>
      </ng-container>
      <ng-container matColumnDef="address">
        <th mat-header-cell *matHeaderCellDef>Address</th>
        <td mat-cell *matCellDef="let row">{{ row.address }}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row">
          <button
            mat-button
            color="primary"
            type="button"
            (click)="$event.stopPropagation(); choose(row)"
          >
            Select
          </button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns" (click)="choose(row)"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">{{ emptyLabel }}</td>
      </tr>
    </table>
  </div>
</div>
<div class="mx-dialog-actions">
  <button mat-button type="button" (click)="onCancel()">Close</button>
  <button mat-raised-button color="primary" type="button" (click)="search()">
    <mat-icon>search</mat-icon>
    Search
  </button>
  <button mat-raised-button color="primary" type="button" *ngIf="isMultiSelect" (click)="confirm()">
    Select
  </button>
</div>
